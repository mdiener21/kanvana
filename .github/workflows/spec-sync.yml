name: Spec Sync

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check-spec-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Validate spec and changelog updates
        run: node scripts/check-spec-sync.mjs --base "${{ github.event.pull_request.base.sha || github.sha }}" --head "${{ github.event.pull_request.head.sha || github.sha }}"
