name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default; jobs that publish widen it for themselves.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Supersede stale PR runs, but never cancel a main run halfway through its deploys.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, unit and DOM tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: client

      - name: Lint
        run: npm run lint
        working-directory: client

      - name: Unit and DOM tests
        run: npm run test:unit && npm run test:dom
        working-directory: client

  e2e:
    name: E2E (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # Shards rather than workers: each shard gets its own runner and dev server, which the
        # suite needs; one dev server stalls page loads under several parallel workers.
        shard: [1, 2, 3]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: client

      - name: Install Playwright browser
        # The runner image already ships Chromium's libraries; --with-deps only adds fonts.
        # When the Ubuntu apt mirror is unreachable, fall back to the browser alone.
        run: npx playwright install --with-deps chromium || npx playwright install chromium
        working-directory: client

      - name: E2E tests
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/3
        working-directory: client

      - name: Upload Playwright report
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: client/playwright-report
          retention-days: 7

  production:
    name: PWA and performance budgets
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: client

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: client

      - name: Production PWA tests
        run: npm run test:pwa
        working-directory: client

      # Its own runner, so E2E load cannot skew the timings the budgets compare against.
      - name: Large-board performance budgets
        run: npm run test:perf
        working-directory: client
        env:
          KANVANA_PERF_BUDGET: ci

      - name: Upload performance measurements
        if: always()
        # Diagnostic only: an artifact-service outage must not fail Test and block deploys.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chromium-performance-measurements
          path: client/test-results/performance-report.json
          if-no-files-found: ignore
          retention-days: 14

  # "Test" is a required status check: it passes only when every test job above passed.
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [checks, e2e, production]
    if: always()

    steps:
      - name: Require every test job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: client

      - name: Build
        run: npm run build
        working-directory: client
        env:
          VITE_PB_URL: ${{ secrets.VITE_PB_URL }}

      - name: Assert build output
        run: |
          [ -f client/dist/index.html ] || (echo "ERROR: client/dist/index.html missing" && exit 1)
          [ -f client/dist/sw.js ] || (echo "ERROR: client/dist/sw.js missing" && exit 1)
          [ -f client/dist/manifest.webmanifest ] || (echo "ERROR: client/dist/manifest.webmanifest missing" && exit 1)

      - name: Upload dist artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: client/dist
          retention-days: 1

  semgrep:
    name: Semgrep Security Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Semgrep ships wheels up to 3.14; on 3.15 its C deps build from source and semgrep-core segfaults.
          python-version: '3.14'

      - name: Install Semgrep
        run: python -m pip install --upgrade pip semgrep

      - name: Run Semgrep scan
        run: semgrep scan --config p/security-audit --config p/secrets --error --sarif --output semgrep.sarif

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: semgrep.sarif

  ftp-deploy:
    name: Deploy via FTP
    runs-on: ubuntu-latest
    needs: [test, build, semgrep]
    if: github.event_name == 'push'

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: ./dist

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp ca-certificates

      - name: Deploy via lftp
        run: |
          lftp -c "
            set net:max-retries 3;
            set net:timeout 20;
            set ftp:passive-mode true;
            set ssl:verify-certificate false;
            set ftp:ssl-allow true;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data yes;
            open -u ${FTP_USER},${FTP_PASSWORD} -p 21 kanvana.com;
            mirror --reverse --delete --verbose ./dist/ ./public_html/;
            bye;
          "
          # ssl:verify-certificate false — shared hosting FTP cert may be self-signed.
          # Encrypted channel (ftp:ssl-force true) is enforced; only cert validation is skipped.
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

  pages-deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [test, build, semgrep]
    if: github.event_name == 'push'

    concurrency:
      group: pages
      cancel-in-progress: false

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: ./dist

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  docker-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: [test, semgrep]
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: prod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/kanvana:latest
            ghcr.io/${{ github.repository_owner }}/kanvana:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
