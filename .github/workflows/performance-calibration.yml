name: Performance calibration

on:
  workflow_dispatch:

jobs:
  calibrate:
    name: Chromium sample ${{ matrix.sample }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: client

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: client

      - name: Measure synthetic boards
        run: npm run test:perf
        working-directory: client
        env:
          KANVANA_PERF_CALIBRATE: '1'
          KANVANA_PERF_BUDGET: ci

      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-calibration-${{ matrix.sample }}
          path: client/test-results/performance-report.json
          if-no-files-found: ignore
          retention-days: 14
