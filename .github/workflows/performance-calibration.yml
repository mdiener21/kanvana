name: Performance calibration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibrate:
    name: Chromium sample ${{ matrix.sample }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: client

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: client

      - name: Measure synthetic boards
        run: npm run test:perf
        working-directory: client
        env:
          KANVANA_PERF_CALIBRATE: '1'
          KANVANA_PERF_BUDGET: ci

      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chromium-calibration-${{ matrix.sample }}
          path: client/test-results/performance-report.json
          if-no-files-found: ignore
          retention-days: 14
